title: NavHub Help Center
description: NavHub documentation
repository: shuaninfo/navhub_doc
url: https://shuaninfo.github.io
baseurl: /navhub_doc

remote_theme: just-the-docs/just-the-docs

color_scheme: light

nav_external_links:
  - title: NavHub App
    url: https://navhub.info

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2024-2026 NavHub. All rights reserved."

# 侧边栏导航排序
nav_sort: case_sensitive

# 搜索
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
